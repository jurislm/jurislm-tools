schema: spec-driven

context: |
  Tech stack: Claude Code Plugin Marketplace (YAML/Markdown only, no compilation step)
  Domain: jurislm-tools — 12-plugin marketplace for JurisLM development workflows

  Plugin types:
    - Credential-bearing local MCP: exact-version .mcp.json launcher + skill (coolify, hetzner, langfuse)
    - OAuth remote MCP: remote server configuration + skills (higgsfield)
    - Skill: SKILL.md with optional compatibility command (repo-standards, podcast-to-blog, codebase-sync, learn-eval)
    - jt-flow: jt-flow-one and jt-flow-all skills for single-request and queue delivery
    - Media workflow Skills: local audio download and analysis, plus MiniMax Design multimodal workflows
    - Commands are optional entry points; they are not separate plugin categories or sources of truth

  Version management: Release Please automation
    feat: → minor bump, fix: → patch bump
    docs:/chore: → no version bump
    Never manually edit version numbers

  Branch workflow: feature worktree (.claude/worktrees/<change-name>) → PR → main
    The repository does not maintain develop; direct push to main is forbidden.

  Spec structure (openspec/specs/):
    _overview/  — marketplace-architecture, openspec-system
    ci-platform/ — Drone validation, release, and merge policy
    content/    — podcast-to-blog-detail
    development-dependency-security/ — npm development dependency policy
    docs-and-standards/ — repo-standards-detail, codebase-sync-detail, standards requirements
    github-flow-entry-documentation/ — entry-document branch-model requirements
    infra/      — infra-overview, coolify-detail, hetzner-detail
    jt-flow-authorization/ — jt-flow authorization
    jt-flow-one-team-mode-dispatch/ — jt-flow team-mode dispatch
    jt-flow-queue-delegation/ — jt-flow queue delegation
    jt-flow-review-orchestration/ — jt-flow review orchestration
    jt-flow-single-skill-naming/ — jt-flow single-request Skill naming
    learning/   — learn-eval-detail
    observability/ — langfuse-detail
    plugin-packaging-integrity/ — marketplace and launcher invariants

rules:
  proposal:
    - Keep proposals under 400 words
    - Always include a "Non-goals" section
    - State which existing plugin(s) this change affects
  tasks:
    - Break tasks into chunks that touch at most one plugin each
    - Each task must reference the specific file path to be changed
