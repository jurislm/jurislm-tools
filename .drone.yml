kind: pipeline
type: docker
name: validate

platform:
  os: linux
  arch: amd64

trigger:
  event:
    - push
    - pull_request
  ref:
    - refs/heads/main
    - refs/pull/*/head

steps:
  - name: validate
    image: node:22.22.2-bookworm-slim
    commands:
      - node scripts/validate-pr-title.mjs
      - node scripts/validate-squash-subject.mjs
      - npm ci
      - npm run validate

---
kind: pipeline
type: docker
name: release

platform:
  os: linux
  arch: amd64

trigger:
  event:
    - push
  ref:
    - refs/heads/main

steps:
  - name: github-release
    image: node:22.22.2-bookworm-slim
    environment:
      RELEASE_PLEASE_TOKEN:
        from_secret: RELEASE_PLEASE_TOKEN
    commands:
      - npx --yes release-please@17.10.4 github-release --token=$RELEASE_PLEASE_TOKEN --repo-url=https://github.com/jurislm/jurislm-tools --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
  - name: release-pr
    image: node:22.22.2-bookworm-slim
    depends_on:
      - github-release
    environment:
      RELEASE_PLEASE_TOKEN:
        from_secret: RELEASE_PLEASE_TOKEN
    commands:
      - npx --yes release-please@17.10.4 release-pr --token=$RELEASE_PLEASE_TOKEN --repo-url=https://github.com/jurislm/jurislm-tools --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
